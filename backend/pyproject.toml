[project]
name = "roamly"
version = "0.1.0"
description = "Evidence-grounded AI Travel Reality Checker (backend)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
roamly-extract = "roamly.cli:main"
roamly-eval = "roamly.evaluation.cli:main"
roamly-resolve = "roamly.places_cli:main"
roamly-confirm = "roamly.places_confirm:main"
roamly-fetch = "roamly.web_fetch_cli:main"
roamly-extract-evidence = "roamly.evidence_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roamly"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]
